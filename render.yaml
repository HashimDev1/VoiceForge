services:
  - type: web
    name: voiceforge-studio
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASR_PROVIDER_PRIORITY
        value: groq,openai,fish_audio,local
      - key: GROQ_API_KEY
        sync: false
      - key: FISH_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_CONCURRENT_TTS
        value: 2
